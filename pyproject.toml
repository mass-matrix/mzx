[project]
maintainers = [
  { name = "Herman Singh", email = "herman@massmatrix.bio" },
  { name = "MassMatrix", email = "eng@massmatrix.bio" },
]
authors = [{ name = "Michael Freitas", email = "mike@massmatrix.bio" }]
name = "mzx"
description = "Easy to use Mass Spec conversion utility"
readme = "README.rst"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Natural Language :: English",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.10",
  "Topic :: File Formats",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Software Development",
]
keywords = ["mass spectrometry", "conversion", "bioinformatics"]
requires-python = ">=3.10"
dependencies = ["loguru>=0.5.0", "lxml>=4.6.0", "pyside6>=6.0"]
dynamic = ["version"]

[project.optional-dependencies]
# The proven pure-Rust Thermo converter (rust/crates/mzx-py). Pinned exactly:
# its byte-identical guarantee is tied to one build. Bump together with
# rust/Cargo.toml's workspace version when releasing mzx-rs.
rust = ["mzx-rs==0.1.0"]

# In this repo, uv builds mzx-rs from rust/crates/mzx-py instead of PyPI, so
# `uv pip install -e ".[rust]"` works from a clone. Only uv reads this; the
# published metadata still says mzx-rs==0.1.0.
[tool.uv.sources]
mzx-rs = { path = "rust/crates/mzx-py" }

[project.scripts]
mzx = "mzx.cli:main"

# gui_scripts: GUI launcher uses pythonw on Windows (no extra console window).
[project.entry-points.gui_scripts]
mzx-gui = "mzx.gui:main"

[project.urls]
Documentation = "https://mzx.readthedocs.io/en/latest/"
"Source Code" = "https://github.com/mass-matrix/mzx"
"Issue Tracker" = "https://github.com/mass-matrix/mzx/issues"


[build-system]
requires = ["setuptools>=63.0"]
build-backend = "setuptools.build_meta"

[[tool.mypy.overrides]]
module = "PySide6.*"
ignore_missing_imports = true

# Optional Rust backend (rust/crates/mzx-py); typed via its own stubs when installed.
[[tool.mypy.overrides]]
module = "mzx_rs"
ignore_missing_imports = true

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "mzx.__version__" }

[tool.setuptools.package-data]
"*" = ["src/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "--tb=short -v"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.paths]
source = ["src"]
