# Coverage of the Rust Thermo reader (crates/mzx-thermo).
#
# A row is proven when `crates/mzx-verify/tests/thermo_reader.rs` (run with
# MZX_CORPUS set) converts every listed file under every listed option set and
# `contract_compare` finds it identical to the msconvert golden. The reader
# itself is fail-closed: anything outside these rows returns `Unsupported`
# (unknown controller kind, instrument recipe, scan-event preamble, packet
# type, trailer value type, ...), and mzx falls back to msconvert.

[[proven]]
vendor = "Thermo"
raw_version = 66
instrument = "Q Exactive Focus"
controllers = ["MS", "PDA", "Other (no scans)"]
scan_events = ["FTMS + c ESI Full ms", "FTMS + c ESI Full lock ms", "FTMS + c ESI d Full ms2 <mz>@hcd<e>"]
option_sets = ["default", "nofilter"]
files = ["190218_AR_JH_A_pos.raw", "190218_AR_JH_Blank2_pos.raw"]

# LTQ XL ion-trap files. Vendor peak picking of their profile scans uses
# mzx's model of Thermo's ion-trap Scan.ToCentroid
# (crates/mzx-thermo/src/centroid.rs, inferred from msconvert output), proven
# 2026-11-06: every centroid of every Thermo-centroided profile scan (MS1 and
# MS2) matches bit for bit, and so do the precursor peak intensities summed
# over vendor-centroided MS1.
[[proven]]
vendor = "Thermo"
raw_version = 66
instrument = "LTQ XL"
controllers = ["MS"]
scan_events = ["ITMS - p ESI Full ms", "ITMS - c ESI d Full ms2 <mz>@cid<e>"]
option_sets = ["nofilter", "default", "pickall", "pickall_rz"]
files = ["LR_p_LTQ_HILIC_ecoli.raw"]

[[proven]]
vendor = "Thermo"
raw_version = 66
instrument = "LTQ XL"
controllers = ["MS"]
scan_events = ["ITMS - p ESI Full ms", "ITMS - p ESI d Full ms2 <mz>@cid<e>"]
option_sets = ["nofilter", "default", "pickall", "pickall_rz"]
files = ["LR_p_LTQ_IPRP.raw", "LR_p_LTQ_IPRP_ecoli.raw"]

[[unsupported]]
vendor = "Thermo"
instrument = "Orbitrap Fusion Lumos"
reason = "unproven instrument family and controller kind 2 (Vanquish); goldens exist, reader not written"
option_sets = ["default", "nofilter"]
files = ["HR_OH_Orbi_HILIC.raw", "LR_OH_Orbi_HILIC.raw"]
