[workspace]
resolver = "2"
members = ["crates/mzx-convert", "crates/mzx-filters", "crates/mzx-mzml", "crates/mzx-py", "crates/mzx-thermo", "crates/mzx-verify", "crates/mzx-zng"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/mass-matrix/mzx"

[workspace.dependencies]
anyhow = "1"
cc = "1"
cmake = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib"] }
quick-xml = "0.37"
